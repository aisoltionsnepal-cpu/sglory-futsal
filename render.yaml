services:
  - type: web
    name: sglory-futsal
    runtime: node
    plan: free
    branch: main
    autoDeploy: yes
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sglory-futsal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sglory-futsal-db
    plan: free
    databaseName: sglory_futsal
